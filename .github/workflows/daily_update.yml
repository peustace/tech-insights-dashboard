name: Daily Tech Insights Automation

on:
  schedule:
    # Runs automatically at 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual triggers from GitHub interface

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Fetch & AI Summarizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_data.py

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git status
          git commit -m "Automated Daily Dashboard Update [skip ci]" || exit 0
          git push

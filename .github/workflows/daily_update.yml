name: Tech Insights Update

on:
  schedule:
    # Every 4 hours (UTC). The 06:00 run also sends the Slack/email digest if configured.
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      force_weekly:
        description: 'Generate the weekly recap now (normally Sundays only)'
        type: boolean
        default: false
      send_digest:
        description: 'Send the Slack/email digest now'
        type: boolean
        default: false

permissions:
  contents: write   # lets the job commit data.json, state/ and archive/

concurrency:
  group: tech-insights-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, summarise and rank
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}        # optional repository variable
          FORCE_WEEKLY: ${{ inputs.force_weekly && '1' || '' }}
        run: python fetch_data.py

      - name: Send digest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}                # optional repository variable
        run: python digest.py ${{ inputs.send_digest && '--force' || '--only-hour 6' }}

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json state archive
          git commit -m "Automated update [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
